name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CC=clang" >> "$GITHUB_ENV"
          else
            echo "CXX=g++" >> "$GITHUB_ENV"
            echo "CC=gcc" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-debug
            configuration: Debug
          - preset: windows-release
            configuration: Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.configuration }} --output-on-failure

  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-24" "ndk;${ANDROID_NDK_VERSION}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_NDK_HOME=${android_sdk_root}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Configure Android arm64
        run: cmake --preset android-arm64-release
      - name: Build Android Core, Simulator and Host Adapter
        run: cmake --build --preset android-arm64-release --target mira_core mira_simulator_adapter mira_android_adapter mira_net_transport mira_mbedtls_transport

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, UBSAN, TSAN]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMIRA_ENABLE_${{ matrix.sanitizer }}=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        if: matrix.sanitizer != 'TSAN'
        run: ctest --test-dir build --output-on-failure
      - name: Test with TSAN
        if: matrix.sanitizer == 'TSAN'
        run: setarch x86_64 -R ctest --test-dir build --output-on-failure

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install quality tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy
          # Pin clang-format to the version the tree is formatted with; the
          # apt snapshot is not reproducible across runner updates.
          python3 -m pip install 'clang-format==18.1.8'
          sudo ln -sf "$(command -v clang-format)" /usr/local/bin/clang-format
          clang-format --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMIRA_ENABLE_CLANG_TIDY=ON
      - name: Static analysis build
        run: cmake --build build --parallel 2
      - name: Format, docs, supply chain
        run: cmake --build build --target format-check docs-check sbom-check platform-boundary-check
